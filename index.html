<style>
:root{--bg:#F4F6F9;--panel:#fff;--ink:#0E1B2A;--muted:#5A6B7D;--line:#DDE3EA;--red:#D2463A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0B131C;--panel:#132030;--ink:#E8EEF4;--muted:#93A4B6;--line:#24364A;--red:#F07062}}
*{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 26px;width:100%;max-width:340px;text-align:center}
.box img{width:72px;height:72px;border-radius:16px}
h1{font-size:24px;font-weight:800;margin:14px 0 4px;letter-spacing:-.02em}
p{margin:0 0 18px;color:var(--muted);font-size:15px}
input{width:100%;font:inherit;font-size:24px;letter-spacing:.4em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus{outline:3px solid #1F7A8C;outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:12px;background:var(--ink);color:var(--panel);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:20px;margin-top:10px}
label.rm{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:14px;color:var(--muted)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <img src="apple-touch-icon.png" alt="">
  <h1>Bite Board</h1>
  <p>Enter the passcode to open.</p>
  <input id="code" type="password" inputmode="numeric" autocomplete="current-password" aria-label="Passcode" autofocus>
  <label class="rm"><input type="checkbox" id="rem" checked style="width:auto"> Remember this device</label>
  <button id="go" type="submit">Unlock</button>
  <div class="err" id="err" role="alert"></div>
</form>

const un=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function decrypt(keyRaw){
  const k=await crypto.subtle.importKey("raw",keyRaw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:un(D.i)},k,un(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function derive(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:un(D.s),iterations:D.n,hash:"SHA-256"},base,256);
}
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
let saved=null;try{saved=localStorage.getItem("bb-key");}catch(e){}
if(saved){f.style.visibility="hidden";decrypt(un(saved)).then(show).catch(()=>{try{localStorage.removeItem("bb-key")}catch(e){}f.style.visibility="";});}
f.onsubmit=async e=>{e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Unlocking…";
  const rem=document.getElementById("rem").checked;
  try{const raw=await derive(document.getElementById("code").value);
    const html=await decrypt(raw);
    if(rem){try{localStorage.setItem("bb-key",b64(raw));}catch(e){}}
    show(html);
  }catch(x){go.disabled=false;go.textContent="Unlock";err.textContent="That's not it. Try again.";
    f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");document.getElementById("code").select();}
};
})();
